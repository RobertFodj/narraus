server.port=${PORT:8080}
logging.level.org.atmosphere=warn

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/narraus}
spring.datasource.username=${DB_USER:narraus}
spring.datasource.password=${DB_PASSWORD:narraus}

# Skeemaa hallitsee Flyway (src/main/resources/db/migration). Hibernate vain tarkistaa, että entiteetit täsmäävät.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
narraus.upload-dir=${UPLOAD_DIR:./uploads}

vaadin.allowed-packages=com.vaadin,org.vaadin,com.narraus

# Kartta ja paikkahaku (MapTiler). Avain annetaan ympäristömuuttujana, ei commitoida.
narraus.maptiler-key=${MAPTILER_KEY:}
narraus.map-style=outdoor-v4

# Web push (VAPID-avaimet annetaan ympäristömuuttujina, yksityistä avainta ei commitoida).
# Ilman avaimia push-ilmoitukset ovat pois käytöstä. Subject on URL tai mailto: (Apple vaatii).
narraus.push.public-key=${VAPID_PUBLIC_KEY:}
narraus.push.private-key=${VAPID_PRIVATE_KEY:}
narraus.push.subject=${VAPID_SUBJECT:https://narraus.paik.at}

# Ylläpitäjä: vain tällä käyttäjätunnuksella voi luoda, muokata ja poistaa kilpailuja (eventtejä)
narraus.admin-username=${ADMIN_USERNAME:robbe}

# Pysy kirjautuneena: kuinka monta päivää kirjautuminen säilyy selaimessa (kumoutuu uloskirjautumisella)
narraus.remember-me-days=90

# Sovellus on Caddyn (HTTPS-päätepiste) takana: luota X-Forwarded-*-otsikoihin, jotta pyynnön tiedetään olevan
# HTTPS. Muuten evästeet (myös "pysy kirjautuneena") jäävät ilman Secure-lippua ja ohjausosoitteet alkavat http://.
# (boot2vm asettaa väärän nimisen ympäristömuuttujan SERVER_FORWARDED_HEADERS_STRATEGY, joka ei vaikuta Springiin.)
server.forward-headers-strategy=native
