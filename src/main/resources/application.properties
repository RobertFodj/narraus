server.port=${PORT:8080}
logging.level.org.atmosphere=warn

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/narraus}
spring.datasource.username=${DB_USER:narraus}
spring.datasource.password=${DB_PASSWORD:narraus}

# Skeemaa hallitsee Flyway (src/main/resources/db/migration). Hibernate vain tarkistaa, että entiteetit täsmäävät.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
narraus.upload-dir=${UPLOAD_DIR:./uploads}

vaadin.allowed-packages=com.vaadin,org.vaadin,com.narraus
